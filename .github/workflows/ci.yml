name: CI

on:
  push:
    branches:
      - node
  pull_request:
    branches:
      - node
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js Unit & Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check JS syntax
        run: npm run check

      - name: Run unit & integration test suite
        run: npm test

      - name: Verify CLI entrypoint
        run: |
          node tmem/cli.mjs --help
          node tmem/cli.mjs --version

      - name: Smoke test CLI evaluation report
        run: node tmem/cli.mjs evaluate
