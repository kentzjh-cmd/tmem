[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmem"
version = "0.2.0"
description = "Invisible Backward-Slicing Execution Trace Memory Compiler for Coding Agents (agy, dsh, codex, opencode, pi)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "kentzjh-cmd" }
]
dependencies = []

[project.scripts]
tmem = "tmem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tmem*"]

[tool.setuptools.package-data]
tmem = ["dsh_plugin.mjs"]
