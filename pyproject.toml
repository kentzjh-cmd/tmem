[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmem"
version = "0.2.0"
description = "Deterministic Execution Trace Memory & Zero-Token Session Digest for DeepSeek Harness (@deepseek-ai/dsh)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "kentzjh-cmd" }
]
dependencies = []

[project.optional-dependencies]
ast = [
  "tree-sitter>=0.22.0",
  "tree-sitter-language-pack>=0.1.0",
]

[project.scripts]
tmem = "tmem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tmem*"]

[tool.setuptools.package-data]
tmem = ["dsh_plugin.mjs"]
